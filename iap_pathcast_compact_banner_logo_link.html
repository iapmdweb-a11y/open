<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAP × pathCast — Compact Banner</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;background:transparent;font-family:Arial,Helvetica,sans-serif}
  #iap-pathcast-banner{width:100%;max-width:100%;margin:0 auto;overflow:hidden;background:#2E1F4D;color:#fff;border-radius:12px;padding:clamp(14px,2.1vw,24px) clamp(16px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:clamp(12px,2vw,24px);position:relative;isolation:isolate}
  #iap-pathcast-banner .eyebrow{display:flex;align-items:center;gap:9px;color:#F08BB0;font-size:clamp(10px,1.05vw,13px);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
  #iap-pathcast-banner .eyebrow:before{content:"";display:block;width:24px;height:3px;background:#F08BB0;flex:none}
  #iap-pathcast-banner .brandline{display:flex;align-items:baseline;gap:clamp(7px,1.2vw,14px);line-height:1;margin:0 0 7px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,4.1vw,48px);font-weight:700;letter-spacing:-1px;white-space:nowrap}
  #iap-pathcast-banner .cross{color:#F08BB0;font-size:.68em}
  #iap-pathcast-banner .description{margin:0;color:#E6DDF2;font-size:clamp(12px,1.35vw,15px);line-height:1.4;max-width:650px}
  #iap-pathcast-banner .actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
  #iap-pathcast-banner .mou{color:#fff;text-decoration:underline;text-decoration-color:#F08BB0;text-underline-offset:3px;font-size:clamp(11px,1.15vw,13px);font-weight:700;line-height:1.3}
  #iap-pathcast-banner .logo-link{display:block;width:clamp(112px,16vw,170px);padding:8px 10px;background:#fff;border:0;border-radius:10px;text-decoration:none;line-height:0;cursor:pointer}
  #iap-pathcast-banner .logo-link img{display:block;width:100%;height:auto}
  #iap-pathcast-banner a:focus-visible,#iap-pathcast-banner button:focus-visible{outline:3px solid #F08BB0;outline-offset:3px}
  @media(max-width:520px){
    #iap-pathcast-banner{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:13px 12px;border-radius:9px}
    #iap-pathcast-banner .brandline{font-size:clamp(24px,7vw,34px);gap:5px;letter-spacing:-.6px;margin-bottom:5px}
    #iap-pathcast-banner .eyebrow{font-size:9px;letter-spacing:1.2px;gap:6px}
    #iap-pathcast-banner .eyebrow:before{width:16px}
    #iap-pathcast-banner .description{font-size:11px;line-height:1.35}
    #iap-pathcast-banner .logo-link{width:88px;padding:6px;border-radius:7px}
    #iap-pathcast-banner .actions{gap:7px}
    #iap-pathcast-banner .mou{font-size:10px;max-width:110px}
  }
  @media(max-width:350px){#iap-pathcast-banner{grid-template-columns:1fr}#iap-pathcast-banner .actions{flex-direction:row;align-items:center;justify-content:space-between}#iap-pathcast-banner .logo-link{width:100px}}
</style>
</head>

<script>
(function(){
  'use strict';
  const banner=document.getElementById('iap-pathcast-banner');
  if(!banner)return;
  const link=banner.querySelector('.logo-link');
  if(!link)return;
  // Clicking the logo opens the Open Pathology website; retain the sound/voice cue.
  link.addEventListener('click',function(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        const ctx=new AC();
        const master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);
        const t=ctx.currentTime;
        const bell=(f,start,vol)=>{
          [[1,1],[2.76,.35],[5.4,.12]].forEach(([m,a])=>{
            const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*m;
            g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol*a,start+.01);g.gain.exponentialRampToValueAtTime(.0001,start+1.8/m+.3);
            o.connect(g);g.connect(master);o.start(start);o.stop(start+2.3);
          });
        };
        [523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,t+.12+i*.12,.22));
        bell(1318.5,t+.85,.15);bell(1046.5,t+.85,.15);
        window.setTimeout(()=>{try{ctx.close()}catch(e){}},3500);
      }
    }catch(e){}
    try{
      if('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window){
        const u=new SpeechSynthesisUtterance('Open');u.rate=.8;u.pitch=1;u.volume=1;
        window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
      }
    }catch(e){}
  });
})();
</script>
